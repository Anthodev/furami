[package]
name = "furami"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[dependencies]
cxx = "=1.0.202"
cxx-qt = "=0.10.0"
libloading = "=0.9.0"
cxx-qt-lib = { version = "=0.10.0", default-features = false, features = ["qt_gui", "qt_qml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-build = "=1.0.202"
cxx-qt-build = "=0.10.0"
serde_json = "1"
