[package]
name = "furami"
version = "2.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[dependencies]
cxx = "=1.0.202"
libloading = "=0.9.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

# Registry pins match examples/gpui-poc.
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.13", default-features = false, features = ["x11"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.13", default-features = false, features = ["x11"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
libc = "=0.2.189"
raw-window-handle = "=0.6.2"
url = "=2.5.8"
x11rb = { version = "=0.13.2", features = ["shape"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

[build-dependencies]
cxx-build = "=1.0.202"
serde_json = "1"
