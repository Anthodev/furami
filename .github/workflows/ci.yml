name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  linux:
    name: Build, test and lint (Avrea Ubuntu 24.04 x86_64)
    runs-on: avrea-ubuntu-24.04-2-vcpu
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            lld \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-shape0-dev

      - name: Read qualified Qt version
        run: |
          python3 -c 'import json; print("QT_VERSION=" + json.load(open("packaging/media/stack.lock.json"))["sources"]["qt"]["version"])' >> "$GITHUB_ENV"

      - name: Install pinned Qt via aqtinstall
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --no-cache-dir aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt-venv/bin/aqt" install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt" --modules qtshadertools

      - name: Export Qt environment
        run: |
          echo "QMAKE=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/bin/qmake" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
