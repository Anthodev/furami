name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  linux:
    name: Build, test and lint (Avrea Ubuntu 24.04 x86_64)
    runs-on: avrea-ubuntu-24.04-2-vcpu
    # Match the pinned AppImage compiler's GNU BFD linker selection.
    env:
      RUSTFLAGS: "-Clinker-features=-lld -Clink-arg=-fuse-ld=bfd"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            lld \
            libgl1-mesa-dev \
            libx11-dev \
            libpulse0 \
            libxcb1-dev \
            libxcb-shape0-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Isolate Rust toolchain state
        # Keep toolchains separate from the runner's preinstalled Rust state.
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
