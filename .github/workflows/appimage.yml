name: AppImage

on:
  workflow_dispatch:
    # Builds and uploads an Actions artifact only. Never publishes, even
    # when dispatched on a tag ref.
    inputs:
      verify_reproducibility:
        description: 'Run the two-build reproducibility comparison (build-twice.py) instead of a single build'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Manual path: artifact only, no publication.
  # ------------------------------------------------------------------
  build-manual:
    if: github.event_name == 'workflow_dispatch'
    name: Build AppImage artifact (manual, not published)
    runs-on: avrea-ubuntu-24.04-4-vcpu
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            lld \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            python3 podman crun binutils
          podman info --format '{{.Host.Security.Rootless}}' | grep -qx true
          readelf --version

      - name: Run offline behavioral suites
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s packaging/appimage -p '*_tests.py'
          python3 -m unittest discover -s packaging/appimage -p 'test_*.py'
          python3 -m unittest discover -s packaging/media -p build_tests.py
          python3 -m unittest discover -s packaging/appimage-runtime -p build_tests.py

      - name: Derive version from Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "Could not read version from Cargo.toml" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build AppImage (cold frozen recipes)
        env:
          VERIFY_REPRODUCIBILITY: ${{ inputs.verify_reproducibility }}
        run: |
          if [ "$VERIFY_REPRODUCIBILITY" = "true" ]; then
            # The comparison acquires the full checked source tree too.
            python3 packaging/appimage/build-twice.py \
              --version "$APP_VERSION" \
              --output "$RUNNER_TEMP/appimage-out" \
              --acquire-sources
          else
            python3 packaging/appimage/build.py \
              --version "$APP_VERSION" \
              --output "$RUNNER_TEMP/appimage-out" --acquire-sources
          fi

      - name: Verify release directory
        run: |
          extra=()
          if [ "${{ inputs.verify_reproducibility }}" = "true" ]; then extra+=(--require-reproducibility); fi
          python3 scripts/publish_candidate.py --check-only "${extra[@]}" \
            --event-name push --tag "v$APP_VERSION" --candidate "$RUNNER_TEMP/appimage-out/release"

      - name: Collect candidate build evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-evidence"
          python3 - <<'PY'
          import importlib.util, os, pathlib
          repo = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'appimage-out'
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'appimage-evidence'
          spec = importlib.util.spec_from_file_location('furami_candidate_build', repo / 'packaging/appimage/build.py')
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          builder.collect_evidence(out, dest, os.environ['GITHUB_SHA'])
          for path in dest.rglob('*.json'):
              print(str(path), path.read_text())
          PY

      - name: Upload diagnostic evidence separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage-evidence-manual-${{ github.run_id }}
          path: ${{ runner.temp }}/appimage-evidence/
          if-no-files-found: warn

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Furami-${{ env.APP_VERSION }}-x86_64-unpublished
          path: ${{ runner.temp }}/appimage-out/release/
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Tag path: validate before any side effect.
  # ------------------------------------------------------------------
  validate-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Validate release tag
    runs-on: avrea-ubuntu-24.04-2-vcpu
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract release notes from tagged changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release_notes.py \
            --tag "$RELEASE_TAG" \
            --commit "$EVENT_SHA" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Check tag version matches Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import pathlib, sys, tomllib
          sys.path.insert(0, 'scripts')
          from publish_candidate import release_channel
          import os
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          release_channel(os.environ['RELEASE_TAG'], version, 'push')
          PY

      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Tag path: single frozen-recipe build; two-build comparison is manual dispatch only.
  # ------------------------------------------------------------------
  build-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate-release
    name: AppImage release build
    runs-on: avrea-ubuntu-24.04-2-vcpu
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            lld \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            python3 podman crun binutils
          podman info --format '{{.Host.Security.Rootless}}' | grep -qx true
          readelf --version

      - name: Run offline behavioral suites
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s packaging/appimage -p '*_tests.py'
          python3 -m unittest discover -s packaging/appimage -p 'test_*.py'
          python3 -m unittest discover -s packaging/media -p build_tests.py
          python3 -m unittest discover -s packaging/appimage-runtime -p build_tests.py

      - name: Build release AppImage (single build)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          python3 packaging/appimage/build.py
          --version "${RELEASE_TAG#v}"
          --output "$RUNNER_TEMP/appimage-out"
          --acquire-sources

      - name: Verify release directory
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/publish_candidate.py --check-only \
            --event-name push --tag "$RELEASE_TAG" --candidate "$RUNNER_TEMP/appimage-out/release"

      - name: Summarize failure blockers
        if: failure()
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Release build failed for $RELEASE_TAG"
            echo "- Commit: $GITHUB_SHA"
            echo "- Single-build release pipeline failed; see the failing step log."
            if [ -d "$RUNNER_TEMP/appimage-out" ]; then
              echo "- Output tree at failure:"
              find "$RUNNER_TEMP/appimage-out" -maxdepth 2 -type f | sed 's/^/  - /' || true
            else
              echo "- No output tree was produced."
            fi
            if [ -f "$RUNNER_TEMP/appimage-out/release/release-ready.json" ]; then
              echo "- release-ready.json:"
              cat "$RUNNER_TEMP/appimage-out/release/release-ready.json"
            else
              echo "- No release-ready.json was generated (source/license gate did not complete)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect release build evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-evidence"
          python3 - <<'PY'
          import importlib.util, json, os, pathlib
          repo = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'appimage-out'
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'appimage-evidence'
          spec = importlib.util.spec_from_file_location('furami_candidate_build', repo / 'packaging/appimage/build.py')
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          builder.collect_evidence(out, dest, os.environ['GITHUB_SHA'])
          for path in dest.rglob('*.json'):
              print(str(path), path.read_text())
          ready = out / 'release/release-ready.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('## Local candidate gates\\nCommit: ' + os.environ['GITHUB_SHA'] + '\\n')
              stream.write('Reproducibility: not measured (single build)\\n')
              if ready.is_file():
                  stream.write('Clearance: ' + str(json.loads(ready.read_text()).get('ready')) + '\\n')
          PY

      - name: Upload diagnostic evidence separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage-evidence-${{ github.ref_name }}
          path: ${{ runner.temp }}/appimage-evidence/
          if-no-files-found: warn

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.ref_name }}
          path: ${{ runner.temp }}/appimage-out/release/
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Tag path: sole job with write access.
  # ------------------------------------------------------------------
  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate-release, build-release]
    name: Publish GitHub release
    runs-on: avrea-ubuntu-24.04-2-vcpu
    timeout-minutes: 15
    permissions:
      contents: write
    environment: release
    concurrency:
      group: appimage-publish
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.ref_name }}
          path: candidate

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes-${{ github.ref_name }}
          path: notes

      - name: Verify remote tag still points at the event commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # The tag may have been force-moved during the multi-hour build.
          # Resolve the remote tag fresh and require the peeled commit to
          # equal the commit this run was triggered on. Protected tags are
          # the residual control against a move after this check.
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          remote_peeled="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "$remote_peeled" != "$GITHUB_SHA" ]; then
            echo "Remote tag $RELEASE_TAG now points at $remote_peeled, expected $GITHUB_SHA; refusing to publish" >&2
            exit 1
          fi


      - name: Publish verified release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_candidate.py --event-name "$GITHUB_EVENT_NAME" \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --notes "$GITHUB_WORKSPACE/notes/release-notes.md" --candidate "$GITHUB_WORKSPACE/candidate"

      - name: Verify published notes match tagged section
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          published="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if ! diff -u <(printf '%s\n' "$published") "$GITHUB_WORKSPACE/notes/release-notes.md"; then
            echo "Published notes do not match the tagged CHANGELOG section" >&2
            exit 1
          fi

      - name: Summarize failure blockers
        if: failure()
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Release publication failed for $RELEASE_TAG"
            echo "- Commit: $GITHUB_SHA"
            echo "- Failure occurred in the protected publication job; see the failing step log."
            echo "- Downloaded candidate contents:"
            find candidate -maxdepth 1 -type f -printf '  - %f (%s bytes)\n' 2>/dev/null || echo "  - candidate directory missing (artifact download failed)"
            if [ -f candidate/release-ready.json ]; then
              echo "- release-ready.json:"
              cat candidate/release-ready.json
            else
              echo "- candidate/release-ready.json missing: source/license clearance gate did not run or the artifact is incomplete."
            fi
            if [ -f candidate/SHA256SUMS ]; then
              echo "- Recorded checksums:"
              cat candidate/SHA256SUMS
            fi
          } >> "$GITHUB_STEP_SUMMARY"
